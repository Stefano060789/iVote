name: Supabase backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  backup-and-restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Must match (or exceed) the Supabase project's server version - pg_dump/pg_restore
        # refuse to talk to a newer server than their own major version.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install PostgreSQL 17 client tools
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Check required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo "Missing BACKUP_ENCRYPTION_KEY"; exit 1; }

      - name: Create encrypted database dump
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          filename="supabase-${GITHUB_RUN_ID}-${GITHUB_SHA}.dump.enc"
          pg_dump \
            --format=custom \
            --no-owner \
            --no-acl \
            --schema=public \
            --schema=auth \
            --schema=storage \
            "$SUPABASE_DB_URL" \
            | openssl enc -aes-256-cbc -pbkdf2 -salt \
                -pass env:BACKUP_ENCRYPTION_KEY \
                -out "$filename"
          test -s "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Create Supabase-reserved roles in restore target
        # The dump's RLS policies and grants reference roles that Supabase provisions on every
        # project (anon, authenticated, service_role, ...) but a vanilla postgres:17 container
        # doesn't have. Create them (no login, no special privileges needed - this database is
        # thrown away at the end of the job) so pg_restore can attach policies/grants to them.
        run: |
          set -euo pipefail
          for role in anon authenticated service_role authenticator supabase_auth_admin supabase_storage_admin; do
            psql "postgresql://postgres:postgres@127.0.0.1:5432/restore_test" \
              -v ON_ERROR_STOP=1 \
              -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${role}') THEN CREATE ROLE ${role}; END IF; END \$\$;"
          done

      - name: Restore backup into temporary PostgreSQL
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_FILE: ${{ steps.backup.outputs.filename }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:BACKUP_ENCRYPTION_KEY \
            -in "$BACKUP_FILE" \
            -out restored.dump
          pg_restore \
            --exit-on-error \
            --clean \
            --if-exists \
            --no-owner \
            --no-acl \
            --dbname "postgresql://postgres:postgres@127.0.0.1:5432/restore_test" \
            restored.dump

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ steps.backup.outputs.filename }}
          retention-days: 30
          if-no-files-found: error
