<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Godwit business cards - aligned front and back</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 297mm;
      height: 210mm;
      background: #fff;
    }

    .page {
      width: 297mm;
      height: 210mm;
      display: grid;
      grid-template-columns: repeat(3, 85mm);
      grid-template-rows: repeat(2, 55mm);
      gap: 3mm;
      align-content: center;
      justify-content: center;
      page-break-after: always;
    }

    .page:last-child {
      page-break-after: auto;
    }

    .card {
      width: 85mm;
      height: 55mm;
      overflow: hidden;
    }

    .card {
      position: relative;
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .page[aria-label="Backs"] .card img {
      transform: rotate(180deg);
    }

    .back-qr {
      position: absolute;
      left: 34mm;
      top: 4mm;
      width: 14mm;
      height: 14mm;
      padding: 1.2mm;
      background: #fff;
      border-radius: 1mm;
      box-shadow: 0 0.7mm 1.5mm rgba(0, 0, 0, 0.18);
      transform: rotate(180deg);
    }

    .back-qr img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .contact-email {
      position: absolute;
      left: 16mm;
      top: 31mm;
      width: 44mm;
      height: 5mm;
      padding: 0.8mm 1mm;
      background: rgba(255, 255, 255, 0.96);
      color: #263238;
      font: 2.2mm/3.4mm Arial, Helvetica, sans-serif;
      white-space: nowrap;
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <section class="page" aria-label="Fronts">
    <div class="card"><img src="../../business-cards-separated/option-1-front.png" alt="Option 1 front"></div>
    <div class="card"><img src="../../business-cards-separated/option-2-front.png" alt="Option 2 front"></div>
    <div class="card"><img src="../../business-cards-separated/option-3-front.png" alt="Option 3 front"></div>
    <div class="card"><img src="../../business-cards-separated/option-1-front.png" alt="Option 1 front"></div>
    <div class="card"><img src="../../business-cards-separated/option-2-front.png" alt="Option 2 front"></div>
    <div class="card"><img src="../../business-cards-separated/option-3-front.png" alt="Option 3 front"></div>
  </section>
  <section class="page" aria-label="Backs">
    <div class="card"><img src="../../business-cards-separated/option-1-back.png" alt="Option 1 back"><div class="back-qr"><img src="../../business-cards-separated/hellogodwit-qr.svg" alt="QR code to hellogodwit.com"></div><div class="contact-email">contact@hellogodwit.com</div></div>
    <div class="card"><img src="../../business-cards-separated/option-2-back.png" alt="Option 2 back"><div class="back-qr"><img src="../../business-cards-separated/hellogodwit-qr.svg" alt="QR code to hellogodwit.com"></div><div class="contact-email">contact@hellogodwit.com</div></div>
    <div class="card"><img src="../../business-cards-separated/option-3-back.png" alt="Option 3 back"><div class="back-qr"><img src="../../business-cards-separated/hellogodwit-qr.svg" alt="QR code to hellogodwit.com"></div><div class="contact-email">contact@hellogodwit.com</div></div>
    <div class="card"><img src="../../business-cards-separated/option-1-back.png" alt="Option 1 back"><div class="back-qr"><img src="../../business-cards-separated/hellogodwit-qr.svg" alt="QR code to hellogodwit.com"></div><div class="contact-email">contact@hellogodwit.com</div></div>
    <div class="card"><img src="../../business-cards-separated/option-2-back.png" alt="Option 2 back"><div class="back-qr"><img src="../../business-cards-separated/hellogodwit-qr.svg" alt="QR code to hellogodwit.com"></div><div class="contact-email">contact@hellogodwit.com</div></div>
    <div class="card"><img src="../../business-cards-separated/option-3-back.png" alt="Option 3 back"><div class="back-qr"><img src="../../business-cards-separated/hellogodwit-qr.svg" alt="QR code to hellogodwit.com"></div><div class="contact-email">contact@hellogodwit.com</div></div>
  </section>
</body>
</html>
